name: knafayim_app
description: A Flutter application for the Knafayim Association.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'  # Updated this line

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  firebase_storage: ^12.4.6
  firebase_messaging: ^15.2.6



  flutter_file_saver: ^0.9.0  # For better file saving
  device_info_plus: ^10.1.2

  fl_chart: ^1.0.0
  analyzer: 7.3.0

  excel: ^4.0.2
  share_plus: ^11.0.0

  # State management
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  

  
  
  permission_handler: ^12.0.0+1


  # UI
  cupertino_icons: ^1.0.6
  table_calendar: ^3.0.9
  intl: ^0.20.2
  
  # Utils
  uuid: ^4.5.1
  image_picker: ^1.0.7
  flutter_plugin_android_lifecycle: ^2.0.28
  flutter_local_notifications: ^19.2.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  path_provider: ^2.1.5
  pdf: ^3.11.3
  path: ^1.8.3
  timeago: ^3.7.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # mockito: ^5.4.2
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.3.9
  custom_lint: ^0.5.7
  riverpod_lint: ^2.3.7


# Force specific versions of transitive dependencies to ensure compatibility with Flutter 3.29.0
dependency_overrides:
  analyzer: ^6.7.0
  custom_lint_core: ^0.6.4  # Use 0.6.4 instead of 0.6.6
  custom_lint: ^0.6.4       # Match the core version

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
